# NeuroGrid — временный HTTP-блок только для получения сертификата
server {
    listen 80;
    listen [::]:80;
    server_name neurogrid.network www.neurogrid.network api.neurogrid.network;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 200 'neurogrid ok';
        add_header Content-Type text/plain;
    }
}
