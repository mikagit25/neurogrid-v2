services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neurogrid
      POSTGRES_USER: neurogrid
      POSTGRES_PASSWORD: ng_dev_pass_2026
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurogrid"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
