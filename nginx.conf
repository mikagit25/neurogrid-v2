# NeuroGrid — production nginx config
# Frontend: https://neurogrid.network → host:4000 (Next.js)
# Backend:  https://api.neurogrid.network → host:4001 (Express)

# Redirect HTTP → HTTPS for all neurogrid domains
server {
    listen 80;
    listen [::]:80;
    server_name neurogrid.network www.neurogrid.network api.neurogrid.network;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend — neurogrid.network
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name neurogrid.network www.neurogrid.network;

    ssl_certificate     /etc/letsencrypt/live/neurogrid.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neurogrid.network/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass         http://172.20.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# Backend API — api.neurogrid.network
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.neurogrid.network;

    ssl_certificate     /etc/letsencrypt/live/api.neurogrid.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.neurogrid.network/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    location / {
        proxy_pass         http://172.20.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
